<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CajaPro — Confirmación de cuenta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { background: #1e293b; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; border: 1px solid #334155; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .logo-text { font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px; }
    .estado-icon { font-size: 52px; margin-bottom: 20px; line-height: 1; }
    h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 8px; }
    p strong { color: #cbd5e1; }
    .divider { border: none; border-top: 1px solid #334155; margin: 28px 0; }
    .cierre { font-size: 13px; color: #64748b; }
    .btn-download { display: inline-block; margin-top: 20px; background: #3b82f6; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 10px; text-decoration: none; transition: background 0.2s; }
    .btn-download:hover { background: #2563eb; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 99px; margin-bottom: 20px; letter-spacing: 0.3px; }
    .badge-success { background: #14532d; color: #4ade80; }
    .badge-error { background: #450a0a; color: #f87171; }
    .badge-info { background: #1e3a5f; color: #60a5fa; }
    .instruccion { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px 20px; margin-top: 20px; text-align: left; }
    .instruccion p { font-size: 14px; color: #94a3b8; margin: 0; }
    .instruccion p + p { margin-top: 6px; }
    @media (max-width: 480px) { .card { padding: 36px 24px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><div class="logo-icon">🏪</div><span class="logo-text">CajaPro</span></div>
    <div id="contenido"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search)
    const hash = new URLSearchParams(window.location.hash.replace('#', '?'))
    const type = params.get('type') || hash.get('type')
    const accessToken = params.get('access_token') || hash.get('access_token')
    const error = params.get('error') || hash.get('error')
    const errorCode = params.get('error_code') || hash.get('error_code')
    const contenido = document.getElementById('contenido')
    if (error || errorCode) {
      contenido.innerHTML = '<div class="badge badge-error">Link inválido</div><div class="estado-icon">❌</div><h1>El link no es válido</h1><p>Este link de confirmación <strong>expiró</strong> o ya fue usado anteriormente.</p><div class="instruccion"><p>Abrí CajaPro e intentá registrarte nuevamente para recibir un nuevo link.</p><p>Si el problema persiste, contactá al soporte de CajaPro.</p></div>'
    } else if (type === 'recovery') {
      contenido.innerHTML = '<div class="badge badge-info">Recuperación de contraseña</div><div class="estado-icon">🔐</div><h1>Link de recuperación recibido</h1><p>Para recuperar el acceso a CajaPro, contactá al administrador del sistema para que te asigne una nueva contraseña.</p><div class="instruccion"><p>Una vez que tengas tu nueva contraseña, abrí CajaPro e ingresá normalmente con tu email y contraseña.</p></div><hr class="divider" /><p class="cierre">Podés cerrar esta pestaña.</p>'
    } else if (type === 'signup' || type === 'email' || accessToken) {
      contenido.innerHTML = '<div class="badge badge-success">Cuenta verificada</div><div class="estado-icon">✅</div><h1>¡Email confirmado!</h1><p>Tu cuenta fue verificada correctamente.</p><p>Ya podés <strong>iniciar sesión en CajaPro</strong> desde tu computadora.</p><div class="instruccion"><p>Si CajaPro ya está instalado, abrilo y usá tu email y contraseña para ingresar.</p></div><p style="margin-top:20px;font-size:14px;color:#64748b;">¿Todavía no lo instalaste?</p><a class="btn-download" href="https://github.com/nicogiagnorio/cajaPro/releases/latest">Descargar CajaPro</a><hr class="divider" /><p class="cierre">Podés cerrar esta pestaña.</p>'
    } else {
      contenido.innerHTML = '<div class="badge badge-error">Link inválido</div><div class="estado-icon">❌</div><h1>El link no es válido</h1><p>Este link de confirmación <strong>expiró</strong> o ya fue usado anteriormente.</p><div class="instruccion"><p>Abrí CajaPro e intentá registrarte nuevamente para recibir un nuevo link.</p><p>Si el problema persiste, contactá al soporte de CajaPro.</p></div>'
    }
  </script>
</body>
</html>
